<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <script type="text/javascript" src="iconField.js"></script>
  <script type="text/javascript" src="moodOptions.js"></script>
  <script type="text/javascript" src="iconSearch.js"></script>
  <script type="text/javascript" src="capabilities.js"></script>
  <script type="text/javascript" src="preview.js"></script>
  <style>
    @font-face { font-family: 'MDI'; src: url('mdi.woff2') format('woff2'); }
    @font-face { font-family: 'HomeyIcons'; src: url('homey-icons.woff2') format('woff2'); }
    .mdi { font-family: 'MDI'; font-style: normal; line-height: 1; }
    .hicon { font-family: 'HomeyIcons'; font-style: normal; line-height: 1; }
    .repick { color: #c33; font-size: 13px; font-weight: 600; }
    body { padding-bottom: 72px; }
    .top { display: flex; gap: 12px; align-items: center; }
    .tabs { display: flex; gap: 4px; margin: 12px 0; border-bottom: 1px solid #e5e5e5; }
    .tabs button { background: none; border: 0; padding: 10px 12px; font: inherit; color: #888; border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button.active { color: inherit; border-color: currentColor; font-weight: 600; }
    section[data-tab] { display: none; }
    section[data-tab].active { display: block; }
    .row { display: grid; gap: 8px; align-items: stretch; margin-bottom: 8px; }
    .row.chip { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.1fr) 44px 44px; }
    .row.tile { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) 44px minmax(0, 1fr); }
    .row > *, #thermostat { box-sizing: border-box; height: 44px; margin: 0 !important; min-width: 0; }
    .pick { display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 10px; border: 0; border-radius: 10px; background: #f2f2f4; text-align: left; font: inherit; cursor: pointer; overflow: hidden; white-space: nowrap; }
    .pick:disabled { opacity: .5; cursor: default; }
    .pick > span:not(.mdi) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .pick .mdi, .pick .hicon { flex: none; font-size: 22px; width: 24px; text-align: center; }
    .pick img { flex: none; width: 22px; height: 22px; object-fit: contain; }
    .pick .muted, .muted { color: #999; }
    .iconbtn { justify-content: center; padding: 0; }
    .clear { border: 0; border-radius: 10px; background: none; color: #aaa; font-size: 18px; cursor: pointer; }
    .clear:hover { background: #f2f2f4; }
    .row select, .row input { border-radius: 10px; }
    .hint { color: #888; font-size: 12px; margin: 4px 0 10px; }
    .error { color: #c33; }
    /* preview */
    .pv-wrap { width: 100%; max-width: 480px; margin: 0 auto 6px; }
    .pv { width: 480px; height: 320px; position: relative; overflow: hidden; border-radius: 10px; transform-origin: 0 0;
          background: radial-gradient(120% 90% at 0% 0%, #1d1f23 0%, #141518 55%, #0f1012 100%); font-family: -apple-system, 'Inter', sans-serif; }
    .pv .card { position: absolute; box-sizing: border-box; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); }
    .pv .btn { position: absolute; box-sizing: border-box; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; color: #c9d4e6; }
    .pv .btn.amber { background: rgba(242,181,107,.18); border-color: rgba(242,181,107,.45); color: #f6c88f; }
    .pv .txt { position: absolute; display: flex; overflow: hidden; line-height: 1.15; }
    /* picker sheet */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
    .modal.open { display: flex; }
    .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 80vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; }
    .sheet header { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #eee; }
    .sheet header input { flex: 1; }
    .results { overflow: auto; padding: 8px 12px 16px; }
    .results h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; color: #999; letter-spacing: .5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
    .grid button { border: 1px solid #eee; background: #fff; border-radius: 10px; padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .grid button .mdi, .grid button .hicon { font-size: 28px; }
    .grid button span:last-child { font-size: 10px; color: #777; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-bottom: 1px solid #f2f2f2; background: none; text-align: left; font: inherit; cursor: pointer; }
    .list button img { width: 24px; height: 24px; object-fit: contain; }
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: #fff; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center; }
  </style>
</head>
<body>
  <div class="top">
    <h1 class="homey-title" data-i18n="settings.title">NSPanel</h1>
    <select id="panel" class="homey-form-select" style="max-width: 240px"></select>
  </div>
  <p id="nopanel" hidden data-i18n="settings.noPanel"></p>

  <div id="form" hidden>
    <nav class="tabs">
      <button data-tab="home" class="active" data-i18n="settings.tabHome"></button>
      <button data-tab="moods" data-i18n="settings.tabMoods"></button>
      <button data-tab="calendar" data-i18n="settings.tabCalendar"></button>
      <button data-tab="screen" data-i18n="settings.tabScreen"></button>
    </nav>

    <section data-tab="home" class="active">
      <div class="pv-wrap"><div class="pv" id="pv-home"></div></div>
      <p class="hint" data-i18n="settings.previewHint"></p>
      <fieldset class="homey-form-fieldset">
        <legend class="homey-form-legend" data-i18n="settings.thermostat"></legend>
        <button class="pick" id="thermostat"></button>
      </fieldset>
      <fieldset class="homey-form-fieldset">
        <legend class="homey-form-legend" data-i18n="settings.chips"></legend>
        <div id="chips"></div>
      </fieldset>
    </section>

    <section data-tab="moods">
      <div class="pv-wrap"><div class="pv" id="pv-moods"></div></div>
      <p class="hint" data-i18n="settings.tileHint"></p>
      <fieldset class="homey-form-fieldset">
        <legend class="homey-form-legend" data-i18n="settings.tiles"></legend>
        <div id="tiles"></div>
      </fieldset>
    </section>

    <section data-tab="calendar">
      <fieldset class="homey-form-fieldset">
        <div class="homey-form-group">
          <label class="homey-form-label" for="cal-url" data-i18n="settings.calendarUrl"></label>
          <input class="homey-form-input" id="cal-url" placeholder="webcal://p01-caldav.icloud.com/published/2/…">
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="cal-days" data-i18n="settings.daysAhead"></label>
          <input class="homey-form-input" id="cal-days" type="number" min="1" max="14" value="7">
        </div>
        <button class="homey-button-secondary-small" id="cal-test" data-i18n="settings.test"></button>
        <ul id="cal-result"></ul>
      </fieldset>
    </section>

    <section data-tab="screen">
      <fieldset class="homey-form-fieldset">
        <div class="homey-form-group">
          <label class="homey-form-label" for="ss-min" data-i18n="settings.screensaverMinutes"></label>
          <input class="homey-form-input" id="ss-min" type="number" min="0" max="240" value="0">
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="ss-dim" data-i18n="settings.screensaverBrightness"></label>
          <input class="homey-form-input" id="ss-dim" type="number" min="0" max="100" value="10">
        </div>
      </fieldset>
      <fieldset class="homey-form-fieldset">
        <legend class="homey-form-legend" data-i18n="settings.buttons"></legend>
        <div class="homey-form-group">
          <label class="homey-form-label" for="btn-left" data-i18n="settings.left"></label>
          <select class="homey-form-select" id="btn-left"><option value="relay" data-i18n="settings.toggleRelay"></option><option value="event" data-i18n="settings.eventOnly"></option></select>
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="btn-right" data-i18n="settings.right"></label>
          <select class="homey-form-select" id="btn-right"><option value="relay" data-i18n="settings.toggleRelay"></option><option value="event" data-i18n="settings.eventOnly"></option></select>
        </div>
      </fieldset>
    </section>
  </div>

  <div class="savebar" id="savebar" hidden>
    <button class="homey-button-primary-full" id="save" data-i18n="settings.save" style="max-width: 200px"></button>
    <span id="status"></span>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <header>
        <input class="homey-form-input" id="modal-search">
        <button class="homey-button-secondary-small" id="modal-close" data-i18n="settings.close"></button>
      </header>
      <div class="results" id="modal-results"></div>
    </div>
  </div>

  <script>
    const CHIPS = 7, MOODS = 8;
    let H, layout, mdi = {}, panelIcons = {}, glyphToName = {}, devices = {}, moods = [], flows = [], cfg = null;

    const $ = (id) => document.getElementById(id);
    const api = (method, path, body) => new Promise((ok, fail) => H.api(method, path, body ?? null, (e, r) => e ? fail(e) : ok(r)));
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const tr = (key) => H.__(`settings.${key}`) || key;
    const isPanel = (d) => d.driverId === 'nspanel' || String(d.driverId).endsWith(':nspanel');
    const iconChar = (name) => (mdi[name] ? String.fromCodePoint(parseInt(mdi[name], 16)) : '');
    // Chips and tiles use Homey icons: the stored value is the glyph itself, drawn with the HomeyIcons font.
    const display = (glyph) => (glyphToName[glyph] ? glyph : '');
    const iconLabelOf = (key) => key.slice(key.lastIndexOf('/') + 1).replace(/[_-]+/g, ' ');
    const iconHtml = (glyph) => {
      if (!glyph) return `<span class="mdi muted">${esc(iconChar('plus'))}</span>`;
      if (!glyphToName[glyph]) return `<span class="repick" title="Old icon, choose again">!</span>`;
      return `<span class="hicon">${esc(glyph)}</span>`;
    };
    const deviceHtml = (d) => (d
      ? `${d.iconUrl ? `<img src="${esc(d.iconUrl)}" alt="">` : ''}<span>${esc(d.zoneName ? `${d.zoneName} · ` : '')}${esc(d.name)}</span>`
      : `<span class="muted">${esc(tr('device'))}</span>`);
    const otherDevices = (filter) => Object.values(devices).filter((d) => !isPanel(d) && (!filter || filter(d)))
      .sort((a, b) => (a.zoneName + a.name).localeCompare(b.zoneName + b.name));
    const toggleTargets = () => otherDevices((d) => d.capabilities.includes('onoff')).map((d) => ({ id: d.id, name: d.name, zone: d.zoneName }));

    // ---------- generic picker sheet ----------
    let pickerRender = null;
    function openPicker(placeholder, render) {
      pickerRender = render;
      $('modal-search').placeholder = placeholder;
      $('modal-search').value = '';
      $('modal').classList.add('open');
      render('');
      setTimeout(() => $('modal-search').focus(), 50);
    }
    function closePicker() { $('modal').classList.remove('open'); pickerRender = null; }
    function listButtons(items, onPick) {
      const box = document.createElement('div');
      box.className = 'list';
      for (const it of items) {
        const b = document.createElement('button');
        b.innerHTML = it.html;
        b.onclick = () => { closePicker(); onPick(it.value); };
        box.appendChild(b);
      }
      return box;
    }
    function section(title, node) {
      const frag = document.createDocumentFragment();
      if (title) { const h = document.createElement('h4'); h.textContent = title; frag.appendChild(h); }
      frag.appendChild(node);
      return frag;
    }

    function pickIcon(current, onPick) {
      const names = Object.keys(panelIcons);
      openPicker(tr('searchIcons'), (q) => {
        const res = $('modal-results');
        res.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'grid';
        const add = (key, label, glyph) => {
          const b = document.createElement('button');
          b.title = key;
          b.innerHTML = glyph ? `<span class="hicon">${esc(glyph)}</span><span>${esc(label)}</span>` : `<span class="mdi">${esc(iconChar('close'))}</span><span>${esc(label)}</span>`;
          if (glyph === current) b.style.borderColor = '#f2b56b';
          b.onclick = () => { closePicker(); onPick(glyph); };
          grid.appendChild(b);
        };
        add('', tr('noIcon'), '');
        for (const n of searchIcons(q, names, 120)) add(n, iconLabelOf(n), panelIcons[n]);
        res.appendChild(grid);
      });
    }

    function pickDevice(filter, onPick) {
      openPicker(tr('device'), (q) => {
        const term = q.trim().toLowerCase();
        const list = otherDevices(filter).filter((d) => !term || `${d.zoneName} ${d.name}`.toLowerCase().includes(term));
        const res = $('modal-results');
        res.innerHTML = '';
        res.appendChild(listButtons([{ value: '', html: `<span class="muted">${esc(tr('none'))}</span>` }], onPick));
        for (const z of [...new Set(list.map((d) => d.zoneName || ''))]) {
          const items = list.filter((d) => (d.zoneName || '') === z).map((d) => ({ value: d.id, html: deviceHtml({ ...d, zoneName: '' }) }));
          res.appendChild(section(z, listButtons(items, onPick)));
        }
      });
    }

    function pickCapability(device, onPick) {
      const groups = groupCapabilities(device);
      openPicker(tr('capability'), (q) => {
        const term = q.trim().toLowerCase();
        const match = (c) => !term || `${c.title} ${c.id}`.toLowerCase().includes(term);
        const toItems = (cs) => cs.filter(match).map((c) => ({ value: c.id, html: `<span>${esc(c.title)}</span><span class="muted">${esc(c.id)}</span>` }));
        const res = $('modal-results');
        res.innerHTML = '';
        if (groups.suggested.some(match)) res.appendChild(section(tr('suggested'), listButtons(toItems(groups.suggested), onPick)));
        if (groups.other.some(match)) res.appendChild(section(tr('other'), listButtons(toItems(groups.other), onPick)));
      });
    }

    function pickTarget(type, current, onPick) {
      openPicker(tr('target'), (q) => {
        const term = q.trim().toLowerCase();
        const choices = targetChoices(type, { moods, flows, toggles: toggleTargets() }, current.id, current.advanced)
          .filter((c) => !term || c.label.toLowerCase().includes(term));
        const res = $('modal-results');
        res.innerHTML = '';
        res.appendChild(listButtons(choices.map((c) => ({ value: c, html: `<span>${esc(c.label)}</span>` })), onPick));
      });
    }

    // ---------- rows ----------
    function renderThermostat() {
      const btn = $('thermostat');
      btn.innerHTML = deviceHtml(devices[cfg.home.thermostat?.deviceId]);
      btn.onclick = () => pickDevice((x) => x.capabilities.includes('target_temperature'), (id) => {
        cfg.home.thermostat = id ? { deviceId: id } : null;
        renderAll();
      });
    }

    function renderChips() {
      const box = $('chips');
      box.innerHTML = '';
      for (let i = 0; i < CHIPS; i++) {
        const chip = cfg.home.chips[i];
        const d = devices[chip?.deviceId];
        const capTitle = chip && d ? (d.capabilitiesObj[chip.capability]?.title || chip.capability) : '';
        const row = document.createElement('div');
        row.className = 'row chip';
        row.innerHTML = `
          <button class="pick" data-a="device">${deviceHtml(d)}</button>
          <button class="pick" data-a="cap" ${d ? '' : 'disabled'}>${capTitle ? esc(capTitle) : `<span class="muted">${esc(tr('capability'))}</span>`}</button>
          <button class="pick iconbtn" data-a="icon" title="${esc(tr('chooseIcon'))}">${iconHtml(chip?.icon)}</button>
          <button class="clear" data-a="clear">✕</button>`;
        const set = (patch) => {
          cfg.home.chips[i] = { deviceId: '', capability: '', icon: '', ...(cfg.home.chips[i] ?? {}), ...patch };
          renderAll();
        };
        row.querySelector('[data-a=device]').onclick = () => pickDevice(null, (id) => set({ deviceId: id, capability: '' }));
        row.querySelector('[data-a=cap]').onclick = () => d && pickCapability(d, (cap) => set({ capability: cap }));
        row.querySelector('[data-a=icon]').onclick = () => pickIcon(chip?.icon, (glyph) => set({ icon: glyph }));
        row.querySelector('[data-a=clear]').onclick = () => { cfg.home.chips[i] = null; renderAll(); };
        box.appendChild(row);
      }
    }

    function tileTargetLabel(tile) {
      if (!tile || tile.type === 'trigger') return '';
      const id = tile.moodId ?? tile.flowId ?? tile.deviceId ?? '';
      const c = targetChoices(tile.type, { moods, flows, toggles: toggleTargets() }, id, tile.advanced).find((x) => x.value === id);
      return c && id ? c.label : '';
    }

    function renderTiles() {
      const box = $('tiles');
      box.innerHTML = '';
      const typeLabel = {
        '': 'typeNone', mood: 'typeMood', flow: 'typeFlow', toggle: 'typeToggle', trigger: 'typeTrigger',
      };
      for (let i = 0; i < MOODS; i++) {
        const tile = cfg.moods[i];
        const targetText = tileTargetLabel(tile) || (tile?.type === 'trigger' ? tr('typeTrigger') : tr('target'));
        const row = document.createElement('div');
        row.className = 'row tile';
        row.innerHTML = `
          <select class="homey-form-select" data-a="type">${Object.keys(typeLabel).map((t) => `<option value="${t}">${esc(tr(typeLabel[t]))}</option>`).join('')}</select>
          <button class="pick" data-a="target" ${tile && tile.type !== 'trigger' ? '' : 'disabled'}><span class="${tileTargetLabel(tile) ? '' : 'muted'}">${esc(targetText)}</span></button>
          <button class="pick iconbtn" data-a="icon" ${tile ? '' : 'disabled'}>${iconHtml(tile?.icon)}</button>
          <input class="homey-form-input" data-a="label" maxlength="20" placeholder="${esc(tr('label'))}" ${tile ? '' : 'disabled'}>`;
        const type = row.querySelector('[data-a=type]');
        type.value = tile?.type ?? '';
        type.onchange = () => {
          cfg.moods[i] = type.value ? { type: type.value, icon: tile?.icon ?? '', label: tile?.label ?? '' } : null;
          renderAll();
        };
        row.querySelector('[data-a=target]').onclick = () => {
          if (!tile) return;
          const currentId = tile.moodId ?? tile.flowId ?? tile.deviceId ?? '';
          pickTarget(tile.type, { id: currentId, advanced: tile.advanced }, (c) => {
            const previous = targetChoices(tile.type, { moods, flows, toggles: toggleTargets() }, currentId, tile.advanced).find((x) => x.value === currentId);
            const label = nextLabel(tile.label, previous?.name ?? '', c.name ?? '');
            const next = { type: tile.type, icon: tile.icon, label };
            if (tile.type === 'mood') next.moodId = c.value;
            if (tile.type === 'flow') { next.flowId = c.value; next.advanced = c.advanced === true; }
            if (tile.type === 'toggle') next.deviceId = c.value;
            cfg.moods[i] = next;
            renderAll();
          });
        };
        row.querySelector('[data-a=icon]').onclick = () => tile && pickIcon(tile.icon, (glyph) => { cfg.moods[i] = { ...tile, icon: glyph }; renderAll(); });
        const label = row.querySelector('[data-a=label]');
        label.value = tile?.label ?? '';
        label.oninput = () => { if (cfg.moods[i]) { cfg.moods[i].label = label.value; renderPreview('moods'); } };
        box.appendChild(row);
      }
    }

    // ---------- preview ----------
    function renderPreview(page) {
      const el = $(`pv-${page}`);
      const p = layout.pages[page];
      const now = new Date();
      const ctx = {
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }),
        labels: { inside: tr('previewInside'), next: tr('previewNext'), moods: tr('tabMoods') },
        display,
        iconChar,
      };
      const parts = [];
      for (const c of p.cards) parts.push(`<div class="card" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;border-radius:${c.r ?? 18}px"></div>`);
      for (const b of p.buttons) {
        parts.push(`<div class="btn${b.tint === 'amber' ? ' amber' : ''}" style="left:${b.x}px;top:${b.y}px;width:${b.d}px;height:${b.d}px"><span class="mdi" style="font-size:${Math.round(b.d * 0.45)}px">${esc(iconChar(b.icon))}</span></div>`);
      }
      for (const it of previewItems(page, layout, cfg, ctx)) {
        if (!it.text) continue;
        const justify = { left: 'flex-start', center: 'center', right: 'flex-end' }[it.align];
        const align = { top: 'flex-start', center: 'center', bottom: 'flex-end' }[it.valign];
        parts.push(`<div class="txt${it.iconSet ? ` ${it.iconSet === 'homey' ? 'hicon' : 'mdi'}` : ''}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;font-size:${it.px}px;font-weight:${it.weight};color:${it.color};justify-content:${justify};align-items:${align};white-space:${it.wrap ? 'normal' : 'nowrap'}">${esc(it.text)}</div>`);
      }
      el.innerHTML = parts.join('');
      const width = el.parentElement.clientWidth || layout.W;
      const scale = Math.min(1, width / layout.W);
      el.style.transform = `scale(${scale})`;
      el.parentElement.style.height = `${Math.round(layout.H * scale)}px`;
    }

    function renderAll() {
      renderThermostat();
      renderChips();
      renderTiles();
      renderPreview('home');
      renderPreview('moods');
    }

    // ---------- load / save ----------
    async function loadPanel(id) {
      cfg = await api('GET', `/config/${encodeURIComponent(id)}`);
      $('cal-url').value = cfg.calendar?.url ?? '';
      $('cal-days').value = cfg.calendar?.daysAhead ?? 7;
      $('ss-min').value = cfg.screen?.screensaverMinutes ?? 0;
      $('ss-dim').value = cfg.screen?.screensaverBrightness ?? 10;
      $('btn-left').value = cfg.buttons.left;
      $('btn-right').value = cfg.buttons.right;
      $('form').hidden = false;
      $('savebar').hidden = false;
      renderAll();
    }

    async function testCalendar() {
      const out = $('cal-result');
      out.className = '';
      out.innerHTML = `<li>${esc(tr('loading'))}</li>`;
      try {
        const events = await api('POST', '/calendar/test', { url: $('cal-url').value });
        out.innerHTML = events.length
          ? events.map((e) => `<li>${esc(new Date(e.start).toLocaleString([], e.allDay ? { dateStyle: 'medium' } : { dateStyle: 'medium', timeStyle: 'short' }))} — ${esc(e.title)}</li>`).join('')
          : `<li>${esc(tr('noEventsAhead'))}</li>`;
      } catch (e) {
        out.className = 'error';
        out.innerHTML = `<li>${esc(e.message || e)}</li>`;
      }
    }

    async function save() {
      const status = $('status');
      const url = $('cal-url').value.trim();
      const body = {
        home: { thermostat: cfg.home.thermostat, chips: cfg.home.chips.map((c) => (c && c.deviceId && c.capability ? c : null)) },
        moods: cfg.moods,
        calendar: url ? { url, daysAhead: Number($('cal-days').value) } : null,
        screen: { screensaverMinutes: Number($('ss-min').value), screensaverBrightness: Number($('ss-dim').value) },
        buttons: { left: $('btn-left').value, right: $('btn-right').value },
      };
      try {
        cfg = await api('PUT', `/config/${encodeURIComponent($('panel').value)}`, body);
        renderAll();
        status.className = '';
        status.textContent = tr('saved');
      } catch (e) {
        status.className = 'error';
        status.textContent = `${tr('saveFailed')}${e.message || e}`;
      }
    }

    async function onHomeyReady(homey) {
      H = homey;
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = H.__(el.dataset.i18n) || el.textContent; });
      H.ready();

      const loadErrors = [];
      const orEmpty = (key) => (e) => { loadErrors.push(`${tr(key)}: ${e.message || e}`); return []; };
      [devices, panelIcons, moods, flows, layout, mdi] = await Promise.all([
        api('GET', '/devices'), api('GET', '/icons'),
        api('GET', '/moods').catch(orEmpty('loadMoodsFailed')), api('GET', '/flows').catch(orEmpty('loadFlowsFailed')),
        fetch('layout.json').then((r) => r.json()), fetch('mdi-codepoints.json').then((r) => r.json()),
      ]);
      glyphToName = Object.fromEntries(Object.entries(panelIcons).map(([n, g]) => [g, n]));
      if (loadErrors.length) {
        $('status').className = 'error';
        $('status').textContent = `${loadErrors.join('; ')}. ${tr('keptMissing')}`;
      }

      document.querySelectorAll('.tabs button').forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll('.tabs button, section[data-tab]').forEach((x) => x.classList.toggle('active', x.dataset.tab === b.dataset.tab));
          renderPreview('home');
          renderPreview('moods');
        };
      });
      $('modal-close').onclick = closePicker;
      $('modal').onclick = (e) => { if (e.target === $('modal')) closePicker(); };
      $('modal-search').oninput = () => pickerRender && pickerRender($('modal-search').value);
      $('save').onclick = save;
      $('cal-test').onclick = testCalendar;
      window.addEventListener('resize', () => { if (cfg) { renderPreview('home'); renderPreview('moods'); } });

      const panels = Object.values(devices).filter((d) => d.driverId === 'nspanel'); // the app's own records (keyed by data id)
      const sel = $('panel');
      sel.innerHTML = panels.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      sel.onchange = () => loadPanel(sel.value);
      if (panels.length) await loadPanel(panels[0].id);
      else $('nopanel').hidden = false;
    }
  </script>
</body>
</html>
