substitutions:
  name: nspanel
  friendly_name: NSPanel
  icon_relay_on: "\uE334"  # mdi:lightbulb

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - nspanel_ui.h
  on_boot:
    priority: -100
    then:
      - lambda: id(disp1).send_command("brightness=100");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - lambda: id(disp1).send_command("api=1");
  on_client_disconnected:
    - lambda: id(disp1).send_command("api=0");
  actions:
    - action: set_props
      variables:
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            if (keys.size() != values.size()) {
              ESP_LOGW("nspanel_ui", "set_props: %u keys vs %u values", keys.size(), values.size());
              return;
            }
            for (size_t i = 0; i < keys.size(); i++) nspanel_ui::cache().set(id(disp1), keys[i], values[i]);
    - action: goto_page
      variables:
        page: string
      then:
        - lambda: id(disp1).send_command(("page " + page).c_str());
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: id(disp1).send_command(cmd.c_str());
    - action: set_brightness
      variables:
        brightness: int
      then:
        - lambda: |-
            int b = std::max(0, std::min(100, (int) brightness));
            id(disp1).send_command_printf("brightness=%d", b);
            id(disp1).send_command_printf("dim=%d", b);
    - action: set_clock_format
      variables:
        h24: bool
      then:
        - globals.set:
            id: clock_24h
            value: !lambda return h24;
        - script.execute: update_clock
    - action: set_button_mode
      variables:
        button: string
        relay: bool
      then:
        - lambda: |-
            if (button == "left") id(left_relay_mode) = relay;
            else if (button == "right") id(right_relay_mode) = relay;
    - action: play_rtttl
      variables:
        tone: string
      then:
        - rtttl.play:
            rtttl: !lambda return tone;
    - action: upload_tft
      variables:
        url: string
      then:
        - lambda: |-
            id(disp1).set_tft_url(url);
            id(disp1).upload_tft();

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: clock_24h
    type: bool
    restore_value: true
    initial_value: "true"
  - id: left_relay_mode
    type: bool
    restore_value: true
    initial_value: "true"
  - id: right_relay_mode
    type: bool
    restore_value: true
    initial_value: "true"

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Brussels
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

uart:
  id: tf_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

display:
  - platform: nextion
    id: disp1
    uart_id: tf_uart
    update_interval: never
    tft_url: "http://127.0.0.1/nspanel.tft"
    on_page:
      - lambda: |-
          nspanel_ui::cache().on_page(id(disp1), x);
          id(current_page).publish_state(nspanel_ui::page_name(x));
      - script.execute:
          id: send_ui_event
          type: page
          page: !lambda return nspanel_ui::page_name(x);
          slot: ""
          value: ""

text_sensor:
  # The Blackymas TFT writes CSV "<page>,<event>,<component>" into the `localevent` variable.
  - platform: nextion
    nextion_id: disp1
    id: localevent
    component_name: localevent
    internal: true
    on_value:
      - lambda: |-
          auto p = nspanel_ui::split_csv(x);
          if (p.size() < 2) return;
          if (p[0] == "boot" && p[1] == "params") {
            // Boot handshake: stop the TFT's 1 s retry timer (it reboots after 60 tries), then leave boot page.
            id(disp1).send_command("tm_esphome.en=0");
            if (p.size() >= 5) id(tft_version).publish_state(p[4]);
            id(disp1).send_command("page home");
            return;
          }
          std::string slot = p.size() >= 3 ? p[2] : "";
          id(send_ui_event).execute("touch", p[0], slot, p[1]);
  - platform: template
    id: tft_version
    name: Version TFT
    entity_category: diagnostic
  - platform: template
    id: current_page
    name: Current page
    entity_category: diagnostic
  - platform: version
    name: Version ESPHome
    hide_timestamp: true

script:
  - id: send_ui_event
    mode: queued
    max_runs: 20
    parameters:
      type: string
      page: string
      slot: string
      value: string
    then:
      - homeassistant.event:
          event: esphome.nspanel_ui
          data:
            type: !lambda return type;
            page: !lambda return page;
            slot: !lambda return slot;
            value: !lambda return value;
  - id: update_clock
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          nspanel_ui::cache().set(id(disp1), "home.time.txt", now.strftime(id(clock_24h) ? "%H:%M" : "%I:%M"));
          nspanel_ui::cache().set(id(disp1), "home.meridiem.txt", id(clock_24h) ? "" : (now.hour < 12 ? "AM" : "PM"));
  - id: hw_button
    mode: queued
    parameters:
      button: string
      action: string
    then:
      - lambda: |-
          if (action == "short") {
            if (button == "left" && id(left_relay_mode)) id(relay_1).toggle();
            if (button == "right" && id(right_relay_mode)) id(relay_2).toggle();
          }
          id(send_ui_event).execute("hw_button", "", button, action);

binary_sensor:
  - platform: gpio
    id: left_button
    name: Left Button
    pin:
      number: 14
      inverted: true
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - script.execute: { id: hw_button, button: left, action: short }
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: { id: hw_button, button: left, action: long }
  - platform: gpio
    id: right_button
    name: Right Button
    pin:
      number: 27
      inverted: true
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - script.execute: { id: hw_button, button: right, action: short }
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: { id: hw_button, button: right, action: long }

switch:
  - platform: gpio
    id: relay_1
    name: Relay 1
    pin: 22
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: nspanel_ui::cache().set(id(disp1), "home.chip_relay1.txt", "${icon_relay_on}");
    on_turn_off:
      - lambda: nspanel_ui::cache().set(id(disp1), "home.chip_relay1.txt", "");
  - platform: gpio
    id: relay_2
    name: Relay 2
    pin: 19
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: nspanel_ui::cache().set(id(disp1), "home.chip_relay2.txt", "${icon_relay_on}");
    on_turn_off:
      - lambda: nspanel_ui::cache().set(id(disp1), "home.chip_relay2.txt", "");

sensor:
  - platform: wifi_signal
    name: RSSI
    update_interval: 60s
  - platform: adc
    id: ntc_source
    pin: 38
    attenuation: 12db
    samples: 16
    update_interval: 1s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
          send_first_at: 1
      - delta: 0.002
      - heartbeat: 5min
  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
    internal: true
  - platform: ntc
    id: temp_nspanel
    name: Temperature
    sensor: resistance_sensor
    unit_of_measurement: °C
    accuracy_decimals: 1
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - delta: 0.1

output:
  - platform: ledc
    id: buzzer_out
    pin: 21

rtttl:
  output: buzzer_out
