substitutions:
  name: nspanelkeuken
  friendly_name: NSPanel

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - nspanel_ui.h
  on_boot:
    priority: -100
    then:
      - lambda: id(disp1).send_command("brightness=100");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - lambda: id(disp1).send_command("api=1");
  on_client_disconnected:
    - lambda: id(disp1).send_command("api=0");
  actions:
    - action: set_props
      variables:
        keys: string[]
        values: string[]
      then:
        - lambda: |-
            if (keys.size() != values.size()) {
              ESP_LOGW("nspanel_ui", "set_props: %u keys vs %u values", keys.size(), values.size());
              return;
            }
            for (size_t i = 0; i < keys.size(); i++) nspanel_ui::cache().set(id(disp1), keys[i], values[i]);
    - action: goto_page
      variables:
        page: string
      then:
        - lambda: id(disp1).send_command(("page " + page).c_str());
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: id(disp1).send_command(cmd.c_str());
    - action: set_brightness
      variables:
        brightness: int
      then:
        - lambda: |-
            int b = std::max(0, std::min(100, (int) brightness));
            id(disp1).send_command_printf("brightness=%d", b);
            id(disp1).send_command_printf("dim=%d", b);
    - action: set_clock_format
      variables:
        h24: bool
      then:
        - globals.set:
            id: clock_24h
            value: !lambda return h24;
        - script.execute: update_clock
    - action: set_button_mode
      variables:
        button: string
        relay: bool
      then:
        - lambda: |-
            if (button == "left") id(left_relay_mode) = relay;
            else if (button == "right") id(right_relay_mode) = relay;
    - action: play_rtttl
      variables:
        tone: string
      then:
        - rtttl.play:
            rtttl: !lambda return tone;
    - action: power_cycle_display
      then:
        - switch.turn_off: screen_power
        - delay: 2s
        - switch.turn_on: screen_power
    - action: timer_set
      variables:
        seconds: int
        start: bool
      then:
        - lambda: |-
            nspanel_ui::timer().set(seconds > 0 ? seconds : 0, start, millis());
            id(rtttl_out).stop();
        - script.execute: update_timer
    - action: timer_labels
      variables:
        labels: string[]  # running, paused, done, start, pause, resume, stop, reset, home prefix
      then:
        - lambda: |-
            if (labels.size() < 9) return;
            auto &l = nspanel_ui::timer_labels();
            l.running = labels[0]; l.paused = labels[1]; l.done = labels[2]; l.start = labels[3]; l.pause = labels[4];
            l.resume = labels[5]; l.stop = labels[6]; l.reset = labels[7]; l.home_prefix = labels[8];
        - script.execute: update_timer
    - action: cover_begin
      variables:
        id: string
      then:
        - lambda: nspanel_ui::cover().begin(id);
    - action: cover_strips
      variables:
        id: string
        strips: string[]  # "x,y,w,h,color" rectangles in panel coordinates
      then:
        - lambda: |-
            for (auto &s : strips) nspanel_ui::cover().add(id, s);  // drawn by the cover pump interval
    - action: cover_clear
      then:
        - lambda: |-
            nspanel_ui::cover().clear();
            // cover_ic is a 96x96 crop-image text over the cover area: refreshing it paints the cover away.
            if (nspanel_ui::cache().current_page_name() == "media") id(disp1).send_command("ref cover_ic");
    - action: upload_tft
      variables:
        url: string
        baud: int  # 0 = keep current (115200); 921600 is ~8x faster but not every panel copes
      then:
        - lambda: |-
            id(disp1).set_tft_url(url);
            id(disp1).upload_tft(baud > 0 ? (uint32_t) baud : 0);

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: clock_24h
    type: bool
    restore_value: true
    initial_value: "true"
  - id: left_relay_mode
    type: bool
    restore_value: true
    initial_value: "true"
  - id: right_relay_mode
    type: bool
    restore_value: true
    initial_value: "true"

interval:
  # Cover art: ~16 rects per 50 ms (~8 KB/s), below the UART's ~11 KB/s, so the loop never blocks on it.
  - interval: 50ms
    then:
      - lambda: |-
          if (nspanel_ui::cache().current_page_name() == "media") nspanel_ui::cover().pump(id(disp1), 16);
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t done_at = 0;
          static int last_mode = -1;
          auto &t = nspanel_ui::timer();
          uint32_t now = millis();
          if (t.tick(now)) {
            done_at = now;
            id(disp1).send_command("page timer");
            id(send_ui_event).execute("touch", "timer", "", "finished");
          }
          // Alarm: a short beep every 3 s for up to a minute, until Stop.
          if (t.mode == nspanel_ui::TimerState::DONE && now - done_at < 60000 && (now - done_at) % 3000 < 1000)
            id(rtttl_out).play("alarm:d=16,o=6,b=180:c,p,c,p,c");
          if (t.mode == nspanel_ui::TimerState::RUNNING || (int) t.mode != last_mode) id(update_timer).execute();
          last_mode = t.mode;

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Brussels
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

uart:
  id: tf_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

display:
  - platform: nextion
    id: disp1
    uart_id: tf_uart
    update_interval: never
    tft_url: "http://127.0.0.1/nspanel.tft"
    on_page:
      - lambda: |-
          nspanel_ui::cache().on_page(id(disp1), x);
          // Cover art is not a component: redraw it after the page's own props.
          if (nspanel_ui::page_name(x) == "media") nspanel_ui::cover().restart();
          id(current_page).publish_state(nspanel_ui::page_name(x));
      - script.execute:
          id: send_ui_event
          type: page
          page: !lambda return nspanel_ui::page_name(x);
          slot: ""
          value: ""

text_sensor:
  # The Blackymas TFT writes CSV "<page>,<event>,<component>" into the `localevent` variable.
  - platform: nextion
    nextion_id: disp1
    id: localevent
    component_name: localevent
    internal: true
    on_value:
      - lambda: |-
          auto p = nspanel_ui::split_csv(x);
          if (p.size() < 2) return;
          if (p[0] == "boot" && p[1] == "params") {
            // Boot handshake: stop the TFT's 1 s retry timer (it reboots after 60 tries), then leave boot page.
            id(disp1).send_command("tm_esphome.en=0");
            if (p.size() >= 5) id(tft_version).publish_state(p[4]);
            id(disp1).send_command("page home");
            return;
          }
          std::string slot = p.size() >= 3 ? p[2] : "";
          if (p[0] == "timer") {
            // The kitchen timer runs here, so it works without Homey; Homey only gets told.
            auto &t = nspanel_ui::timer();
            if (p[1] == "add") t.add(atoi(slot.c_str()), millis());
            else if (p[1] == "act") t.act(millis());
            else if (p[1] == "reset") t.reset();
            if (t.mode != nspanel_ui::TimerState::DONE) id(rtttl_out).stop();
            id(update_timer).execute();
          }
          id(send_ui_event).execute("touch", p[0], slot, p[1]);
  - platform: template
    id: tft_version
    name: Version TFT
    entity_category: diagnostic
  - platform: template
    id: current_page
    name: Current page
    entity_category: diagnostic
  - platform: version
    name: Version ESPHome
    hide_timestamp: true

script:
  - id: send_ui_event
    mode: queued
    max_runs: 20
    parameters:
      type: string
      page: string
      slot: string
      value: string
    then:
      - homeassistant.event:
          event: esphome.nspanel_ui
          data:
            type: !lambda return type;
            page: !lambda return page;
            slot: !lambda return slot;
            value: !lambda return value;
  - id: update_timer
    then:
      - lambda: |-
          auto &t = nspanel_ui::timer();
          std::string end = "";
          auto now = id(sntp_time).now();
          if (now.is_valid() && t.mode == nspanel_ui::TimerState::RUNNING) {
            auto at = esphome::ESPTime::from_epoch_local(now.timestamp + (t.remaining(millis()) + 999) / 1000);
            end = at.strftime(id(clock_24h) ? "%H:%M" : "%I:%M %p");
          }
          for (auto &kv : nspanel_ui::timer_props(t, millis(), end, nspanel_ui::timer_labels()))
            nspanel_ui::cache().set(id(disp1), kv.first, kv.second);
  - id: update_clock
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          auto txt = now.strftime(id(clock_24h) ? "%H:%M" : "%I:%M %p");
          nspanel_ui::cache().set(id(disp1), "home.time.txt", txt);
          nspanel_ui::cache().set(id(disp1), "screensaver.time.txt", txt);
  - id: hw_button
    mode: queued
    parameters:
      button: string
      action: string
    then:
      - lambda: |-
          if (action == "short") {
            if (button == "left" && id(left_relay_mode)) id(relay_1).toggle();
            if (button == "right" && id(right_relay_mode)) id(relay_2).toggle();
          }
          id(send_ui_event).execute("hw_button", "", button, action);

binary_sensor:
  - platform: gpio
    id: left_button
    name: Left Button
    pin:
      number: 14
      inverted: true
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - script.execute: { id: hw_button, button: left, action: short }
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: { id: hw_button, button: left, action: long }
  - platform: gpio
    id: right_button
    name: Right Button
    pin:
      number: 27
      inverted: true
    on_click:
      - min_length: 20ms
        max_length: 600ms
        then:
          - script.execute: { id: hw_button, button: right, action: short }
      - min_length: 800ms
        max_length: 5s
        then:
          - script.execute: { id: hw_button, button: right, action: long }

switch:
  # Display power (inverted: low = on). Lets us power-cycle a hung display, e.g. after a failed TFT upload.
  - platform: gpio
    id: screen_power
    name: Screen power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: relay_1
    name: Relay 1
    pin: 22
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay_2
    name: Relay 2
    pin: 19
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: wifi_signal
    name: RSSI
    update_interval: 60s
  - platform: adc
    id: ntc_source
    pin: 38
    attenuation: 12db
    samples: 16
    update_interval: 1s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
          send_first_at: 1
      - delta: 0.002
      - heartbeat: 5min
  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
    internal: true
  - platform: ntc
    id: temp_nspanel
    name: Temperature
    sensor: resistance_sensor
    unit_of_measurement: °C
    accuracy_decimals: 1
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      - delta: 0.1

output:
  - platform: ledc
    id: buzzer_out
    pin: 21

rtttl:
  id: rtttl_out
  output: buzzer_out
